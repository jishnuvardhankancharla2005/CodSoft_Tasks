    <text x="745.0" y="184.0" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600"><tspan x="745.0" dy="0">Polynomial Reg.</tspan><tspan x="745.0" dy="17" font-size="10" opacity="0.85">degree 2, R2=0.954</tspan></text>
